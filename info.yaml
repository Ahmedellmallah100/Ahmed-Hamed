project:
  title: "4-Input Perceptron"
  author: "Ahmed Hamed"
  description: "A small hardware implementation of a 4-input perceptron neural network."
  language: "Verilog"
  clock_hz: 100000000

  tiles: "1x1"

pinout:
  ui[0]: "Input x1"
  ui[1]: "Input x2"
  ui[2]: "Input x3"
  ui[3]: "Input x4"
  ui[4]: "Unused"
  ui[5]: "Unused"
  ui[6]: "Unused"
  ui[7]: "Unused"

  uo[0]: "Prediction"
  uo[1]: "z bit 0"
  uo[2]: "z bit 1"
  uo[3]: "z bit 2"
  uo[4]: "z bit 3"
  uo[5]: "z bit 4"
  uo[6]: "z bit 5"
  uo[7]: "Unused"

  uio[0]: "Unused"
  uio[1]: "Unused"
  uio[2]: "Unused"
  uio[3]: "Unused"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"
